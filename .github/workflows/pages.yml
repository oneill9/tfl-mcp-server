name: Publish docs via GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'scripts/test-docs-analytics.py'
      - 'scripts/test-docs-ai.py'
      - 'scripts/docs-hooks.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material 
      - name: Add deployment marker
        run: printf '%s\n' "$GITHUB_SHA" > "docs/deployment-${GITHUB_SHA}.txt"
      - name: Build and test documentation
        run: |
          mkdocs build --strict
          python scripts/test-docs-analytics.py site
          python scripts/test-docs-ai.py site
      - run: mkdocs gh-deploy --force

  indexnow:
    name: Notify IndexNow
    needs: deploy
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify IndexNow
        run: |
          test "$(curl --silent --show-error --fail \
            --retry 30 --retry-delay 2 --retry-all-errors \
            "https://oneill9.github.io/tfl-mcp-server/deployment-${GITHUB_SHA}.txt")" \
            = "$GITHUB_SHA"
          curl --silent --show-error --fail-with-body \
            --request POST "https://api.indexnow.org/indexnow" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary '{
              "host": "oneill9.github.io",
              "key": "b4214842a2958d971df6f1a1c660f154",
              "keyLocation": "https://oneill9.github.io/tfl-mcp-server/b4214842a2958d971df6f1a1c660f154.txt",
              "urlList": [
                "https://oneill9.github.io/tfl-mcp-server/",
                "https://oneill9.github.io/tfl-mcp-server/api-keys/",
                "https://oneill9.github.io/tfl-mcp-server/installation/",
                "https://oneill9.github.io/tfl-mcp-server/migration-v2/",
                "https://oneill9.github.io/tfl-mcp-server/submission/",
                "https://oneill9.github.io/tfl-mcp-server/tools/"
              ]
            }'
          echo "### IndexNow" >> "$GITHUB_STEP_SUMMARY"
          echo "Notified search engines of updated pages" >> "$GITHUB_STEP_SUMMARY"
