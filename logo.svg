<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="TfL MCP Server logo">
  <title>TfL MCP Server</title>
  <defs>
    <clipPath id="bg-clip">
      <rect x="4" y="4" width="192" height="192" rx="32" ry="32"/>
    </clipPath>
  </defs>

  <!-- Rounded square background (PhraseFlip dark) -->
  <rect x="4" y="4" width="192" height="192" rx="32" ry="32" fill="#1c1c1e"/>

  <g clip-path="url(#bg-clip)">
    <!-- Horizontal tube line (PhraseFlip orange accent #ff9f0a) -->
    <rect x="4" y="88" width="192" height="24" fill="#ff9f0a"/>

    <!-- Curved line (PhraseFlip muted #8e8e93) — straight down from top, rounded bend, then diagonal to lower-right -->
    <path d="M 100,-10 L 100,115 Q 100,150 130,180 L 210,260"
          stroke="#8e8e93" stroke-width="24" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Station interchange circle at crossing point -->
  <circle cx="100" cy="100" r="22" fill="#f2f2f7"/>
  <circle cx="100" cy="100" r="14" fill="#1c1c1e"/>
</svg>
